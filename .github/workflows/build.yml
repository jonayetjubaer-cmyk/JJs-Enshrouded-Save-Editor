# Compila o editor e, quando a tag começa com v, publica um release com o executável anexado.
#
# Os recursos da interface já vêm preparados em `build-assets/`, versionados no repositório, e o
# `src-tauri/src/main.rs` os embute no executável em tempo de compilação (`include_dir!`). Por isso
# o build não precisa de Python nem de nenhum passo de preparação: é Node e Rust.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Dependências do Node
        run: npm ci

      - name: Teste de ida e volta do leitor de save
        run: npm test

      - name: Build JJ edition
        shell: pwsh
        run: ./build-windows.ps1

      - name: Conferir que o executável saiu
        shell: pwsh
        run: |
          $exe = "release/JJs-Enshrouded-Save-Editor.exe"
          if (-not (Test-Path $exe)) { throw "o executavel nao foi gerado" }
          $tamanho = (Get-Item $exe).Length
          Write-Host "executavel: $tamanho bytes"
          # ele embute os recursos da interface, entao um exe pequeno significa build sem assets
          if ($tamanho -lt 5000000) { throw "executavel pequeno demais ($tamanho bytes); recursos nao foram embutidos" }

      - uses: actions/upload-artifact@v4
        with:
          name: JJs-Enshrouded-Save-Editor
          path: |
            release/JJs-Enshrouded-Save-Editor.exe
            release/LICENSE
            release/CREDITS.md
          if-no-files-found: error

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/JJs-Enshrouded-Save-Editor.exe
            release/LICENSE
            release/CREDITS.md
          generate_release_notes: true
          body: |
            JJ's Enshrouded Save editor by Jonaex LTD — compact desktop edition.

            Download `JJs-Enshrouded-Save-Editor.exe` and run it. The interface and game data are embedded.
            This edition is based on Nicolas Ferreira's MIT-licensed editor; retain LICENSE and CREDITS.md.

            Para editar as cópias de personagem de um servidor dedicado, é preciso o
            [Enshrouded Server Guardian](https://github.com/nicolasferreiraxn/Enshrouded-Server-Guardian)
            rodando nele. Sem o guardião, o editor trabalha nos saves locais do seu jogo.

            Built by GitHub Actions from this repository. Public build logs are available in Actions.
